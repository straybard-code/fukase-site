<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ベータテスター登録</title>
  <meta name="description" content="釣り支援アプリ ベータテスター登録画面です。">
  <link rel="canonical" href="/beta/register/">
  <link rel="stylesheet" href="../../style.css">
</head>
<body class="beta-page">
  <div class="page-shell">
    <header class="hero hero--secondary">
      <div class="eyebrow-row">
        <span class="eyebrow">Registration</span>
        <span class="eyebrow eyebrow--soft">ベータテスター登録</span>
      </div>
      <h1>ベータテスター登録画面</h1>
      <p class="hero-copy">
        こちらはLPから遷移する登録導線です。ベータ版の内容を確認したうえで、参加をご検討ください。
      </p>
      <div class="hero-actions">
        <a class="button button--primary" href="/beta/">ベータ版LPに戻る</a>
      </div>
      <p class="hero-note">
        このページにはフィードバック送信機能はありません。登録の運用方法は、案内中の既存手順に従ってください。
      </p>
    </header>

    <main>
      <section class="section">
        <div class="info-card">
          <p class="section-copy">
            現在のベータ版は、釣行計画から振り返りまでの操作フローと画面導線を検証するための先行公開版です。
            AI機能は試作表示であり、実際のAI解析は行っていません。
          </p>
          <ul class="bullet-list">
            <li>釣行記録を試してみたい方</li>
            <li>仕様変更を前提に利用できる方</li>
            <li>先行公開版の流れを確認したい方</li>
          </ul>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
