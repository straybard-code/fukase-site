<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ベータテスター登録</title>
  <meta name="description" content="釣り支援アプリのベータテスター登録ページです。">
  <link rel="canonical" href="/beta/register/">
  <link rel="stylesheet" href="../../style.css">
</head>
<body class="beta-page">
  <div class="page-shell">
    <header class="hero hero--secondary">
      <div class="eyebrow-row">
        <span class="eyebrow">Registration</span>
        <span class="eyebrow eyebrow--soft">ベータテスター登録</span>
      </div>
      <h1>ベータテスター登録画面</h1>
      <p class="hero-copy">
        こちらはベータ版への参加を案内するページです。ベータ版はただいま準備中です。
      </p>
      <div class="hero-actions">
        <a class="button button--primary" href="/beta/">ベータ版LPに戻る</a>
      </div>
      <p class="hero-note">
        このページにはフィードバック送信機能はありません。案内中の手順に沿ってご確認ください。
      </p>
    </header>

    <main>
      <section class="section">
        <div class="info-card">
          <p class="section-copy">
            ベータ版は、釣行の記録や操作の流れを確認するための先行公開版です。
            利用前に、内容や注意事項を確認してから参加をご検討ください。
          </p>
          <ul class="bullet-list">
            <li>釣りの羅針盤の先行公開版に興味がある方</li>
            <li>試作段階の画面や操作感を確認したい方</li>
            <li>仕様変更をふまえて利用できる方</li>
          </ul>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
